<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electroprecio - Maqueta</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="top-bar">
        <div class="container">
            <span>Atención al cliente: 900 000 000</span>
            <span>info@electroprecio.com</span>
        </div>
    </div>
    <header>
        <div class="container header-wrap">
            <div class="logo">Electroprecio</div>
            <nav class="main-nav">
                <ul>
                    <li><a href="#">Inicio</a></li>
                    <li><a href="#categorias">Categorías</a></li>
                    <li><a href="#ofertas">Ofertas</a></li>
                    <li><a href="#contacto">Contacto</a></li>
                </ul>
            </nav>
            <div class="search-bar">
                <input type="text" placeholder="Buscar...">
            </div>
            <div class="actions">
                <a href="#" class="account">Mi cuenta</a>
                <a href="#" class="cart">Carrito (0)</a>
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="slides">
            <div class="slide active" style="background-image:url('https://via.placeholder.com/1600x450?text=Promoci%C3%B3n+1');"></div>
            <div class="slide" style="background-image:url('https://via.placeholder.com/1600x450?text=Promoci%C3%B3n+2');"></div>
            <div class="slide" style="background-image:url('https://via.placeholder.com/1600x450?text=Promoci%C3%B3n+3');"></div>
        </div>
    </section>

    <main class="container">
        <section id="categorias" class="categories">
            <h2>Categorías populares</h2>
            <div class="cat-grid">
                <a href="#" class="cat">Televisores</a>
                <a href="#" class="cat">Informática</a>
                <a href="#" class="cat">Móviles</a>
                <a href="#" class="cat">Audio</a>
                <a href="#" class="cat">Electrodomésticos</a>
            </div>
        </section>

        <section id="destacados" class="products">
            <h2>Productos destacados</h2>
            <div class="grid" id="product-grid"></div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 Electroprecio. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
