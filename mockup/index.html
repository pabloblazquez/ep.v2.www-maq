<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electroprecio - Maqueta</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">Electroprecio</div>
            <nav class="main-nav">
                <ul>
                    <li><a href="#">Inicio</a></li>
                    <li><a href="#categorias">Categorías</a></li>
                    <li><a href="#ofertas">Ofertas</a></li>
                    <li><a href="#contacto">Contacto</a></li>
                </ul>
            </nav>
            <div class="search-bar">
                <input type="text" placeholder="Buscar...">
            </div>
            <div class="actions">
                <a href="#" class="account">Mi cuenta</a>
                <a href="#" class="cart">Carrito (0)</a>
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="slides">
            <div class="slide active" style="background-image: url('https://via.placeholder.com/1200x400?text=Promoci%C3%B3n+1');"></div>
            <div class="slide" style="background-image: url('https://via.placeholder.com/1200x400?text=Promoci%C3%B3n+2');"></div>
            <div class="slide" style="background-image: url('https://via.placeholder.com/1200x400?text=Promoci%C3%B3n+3');"></div>
        </div>
    </section>

    <main class="container">
        <section id="destacados" class="products">
            <h2>Productos Destacados</h2>
            <div class="grid" id="product-grid">
                <!-- Productos generados con JS -->
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 Electroprecio. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
